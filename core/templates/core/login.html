{% extends "base/base_auth.html" %}

{% block title %}Login{% endblock %}
{% block auth_subtitle %}Sign in to continue to your company workspace{% endblock %}

{% block auth_content %}
<form method="post" class="grid-1" novalidate>
  {% csrf_token %}
  <div class="form-group mb-16">
    <label class="form-label required" for="id_email">Email</label>
    <input id="id_email" class="form-control" type="email" name="email" value="{{ email|default:'' }}" required>
  </div>
  <div class="form-group mb-24">
    <label class="form-label required" for="id_password">Password</label>
    <input id="id_password" class="form-control" type="password" name="password" required>
  </div>
  <button class="btn btn-primary w-full" type="submit">Sign in</button>
</form>
{% endblock %}
