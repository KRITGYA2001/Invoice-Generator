<div class="modal-backdrop" x-data @click.self="$el.remove()">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Send Invoice by Email</h3>
      <button @click="$el.closest('.modal-backdrop').remove()" class="btn btn-icon btn-secondary">X</button>
    </div>
    <form hx-post="{% url 'invoices_ui:invoice-email' invoice.pk %}" hx-target="#modal-container" hx-swap="innerHTML">
      {% csrf_token %}
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Send To</label>
          <input type="email" name="email" class="form-control" value="{{ invoice.customer_email }}" placeholder="recipient@email.com" required>
          <span class="form-hint">Leave as customer email or enter override</span>
        </div>
        <div class="text-sm text-muted mt-8">
          PDF will be attached automatically. Subject: Invoice {{ invoice.invoice_number }}
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" @click="$el.closest('.modal-backdrop').remove()">Cancel</button>
        <button type="submit" class="btn btn-primary">Send Email</button>
      </div>
    </form>
  </div>
</div>
