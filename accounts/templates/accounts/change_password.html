{% extends "base/base.html" %}

{% block title %}Change Password{% endblock %}

{% block content %}
<div class="card" style="max-width: 480px; margin: 0 auto;"
     x-data="{
       oldPwd: '',
       newPwd: '',
       confirmPwd: '',
       showOld: false,
       showNew: false,
       showConfirm: false,
       get passwordsMatch() {
         return this.newPwd && this.confirmPwd && this.newPwd === this.confirmPwd;
       },
       get canSubmit() {
         return this.oldPwd && this.newPwd.length >= 8 && this.passwordsMatch;
       }
     }">
  <div class="card-header">
    <h1 class="card-title">Change Password</h1>
  </div>

  <form method="POST" novalidate>
    {% csrf_token %}

    <div class="form-group mb-16">
      <label class="form-label required" for="id_old_password">Current Password</label>
      <div class="password-field">
        <input id="id_old_password" class="form-control" :type="showOld ? 'text' : 'password'" name="old_password" x-model="oldPwd" required>
        <button type="button" class="password-toggle" @click="showOld = !showOld" aria-label="Toggle current password">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
        </button>
      </div>
    </div>

    <div class="form-group mb-16">
      <label class="form-label required" for="id_new_password">New Password</label>
      <div class="password-field">
        <input id="id_new_password" class="form-control" :type="showNew ? 'text' : 'password'" name="new_password" x-model="newPwd" required>
        <button type="button" class="password-toggle" @click="showNew = !showNew" aria-label="Toggle new password">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
        </button>
      </div>
      <div class="strength-bar mt-8"><div :class="strengthClass(calcStrength(newPwd))" :style="{ width: calcStrength(newPwd) + '%' }"></div></div>
    </div>

    <div class="form-group mb-24">
      <label class="form-label required" for="id_confirm_new_password">Confirm New Password</label>
      <div class="password-field">
        <input id="id_confirm_new_password" class="form-control" :type="showConfirm ? 'text' : 'password'" name="confirm_new_password" x-model="confirmPwd" :class="{ 'is-valid': passwordsMatch, 'is-invalid': confirmPwd && !passwordsMatch }" required>
        <button type="button" class="password-toggle" @click="showConfirm = !showConfirm" aria-label="Toggle confirm password">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/></svg>
        </button>
      </div>
      <template x-if="passwordsMatch"><span class="valid-feedback">Passwords match</span></template>
    </div>

    <button class="btn btn-primary" type="submit" :disabled="!canSubmit">Update Password</button>
  </form>

  <a class="text-sm mt-16" href="{% url 'accounts_ui:profile' %}">&larr; Back to Profile</a>
</div>

<style>
.strength-bar {
  height: 4px;
  background: var(--gray-200);
  border-radius: 2px;
  margin-top: 6px;
  overflow: hidden;
}
.strength-bar div {
  height: 100%;
  border-radius: 2px;
  transition: width 0.3s, background 0.3s;
}
.strength-weak { background: var(--danger); }
.strength-fair { background: var(--warning); }
.strength-good { background: var(--info); }
.strength-strong { background: var(--success); }
</style>

<script>
function calcStrength(p) {
  let s = 0;
  if (p.length >= 8) s += 25;
  if (/[A-Z]/.test(p)) s += 25;
  if (/[0-9]/.test(p)) s += 25;
  if (/[^A-Za-z0-9]/.test(p)) s += 25;
  return s;
}
function strengthClass(s) {
  if (s <= 25) return 'strength-weak';
  if (s <= 50) return 'strength-fair';
  if (s <= 75) return 'strength-good';
  return 'strength-strong';
}
</script>
{% endblock %}
