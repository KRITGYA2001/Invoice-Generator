{% extends "base/base_auth.html" %}

{% block title %}Sign In{% endblock %}
{% block auth_subtitle %}Sign in to your account{% endblock %}

{% block auth_content %}
<form method="POST" x-data="{ loading: false }" novalidate>
  {% csrf_token %}

  <div class="form-group mb-16">
    <label class="form-label required" for="id_email">Email</label>
    <input
      id="id_email"
      class="form-control"
      type="email"
      name="email"
      value="{{ form_email|default:'' }}"
      autocomplete="email"
      autofocus
      placeholder="your@email.com"
      required
    >
  </div>

  <div class="form-group mb-16" x-data="{ show: false }">
    <label class="form-label required" for="id_password">Password</label>
    <div class="password-field">
      <input
        id="id_password"
        class="form-control"
        :type="show ? 'text' : 'password'"
        name="password"
        autocomplete="current-password"
        required
      >
      <button type="button" class="password-toggle" @click="show = !show" aria-label="Toggle password visibility">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" width="18" height="18">
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.964-7.178Z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="flex-center gap-8 mb-24">
    <input id="id_remember_me" type="checkbox" name="remember_me">
    <label for="id_remember_me" class="text-sm text-muted">Remember me</label>
  </div>

  <button class="btn btn-primary btn-lg w-full" type="submit" @click="loading = true" :disabled="loading">
    <span x-show="!loading">Sign In</span>
    <span x-show="loading" class="flex-center gap-8">
      <span class="spinner"></span>
      Signing in...
    </span>
  </button>
</form>

<p class="text-sm text-center mt-24">
  Don't have an account?
  <a href="{% url 'accounts_ui:register' %}" class="font-bold">Register</a>
</p>
{% endblock %}
