<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Reset Request</title>
</head>
<body style="margin:0;padding:0;background:#f6f7fb;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
    <div style="max-width:640px;margin:0 auto;padding:32px 16px;">
        <div style="background:#ffffff;border-radius:16px;padding:32px;border:1px solid #e5e7eb;">
            <h1 style="margin:0 0 16px;font-size:24px;line-height:1.3;">Password Reset Request</h1>
            <p style="margin:0 0 16px;font-size:15px;line-height:1.7;">You requested a password reset for your {{ site_name }} account for {{ email }}.</p>
            <p style="margin:0 0 8px;font-size:15px;line-height:1.7;">Use the token below in the password reset confirmation flow:</p>
            <div style="margin:16px 0 24px;padding:16px;border-radius:12px;background:#f3f4f6;border:1px dashed #d1d5db;word-break:break-all;font-size:18px;font-weight:700;letter-spacing:1px;">
                {{ reset_key }}
            </div>
            <p style="margin:0;font-size:14px;line-height:1.7;color:#6b7280;">If you did not request this reset, you can ignore this email.</p>
        </div>
    </div>
</body>
</html>
