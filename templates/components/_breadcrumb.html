{% if breadcrumbs %}
<nav class="mb-16 text-sm text-muted" aria-label="Breadcrumb">
  {% for crumb in breadcrumbs %}
    {% if not forloop.first %} / {% endif %}
    {% if crumb.url %}<a href="{{ crumb.url }}">{{ crumb.label }}</a>{% else %}<span>{{ crumb.label }}</span>{% endif %}
  {% endfor %}
</nav>
{% endif %}
